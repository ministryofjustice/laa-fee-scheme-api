name: Preview deploy

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

    secrets:
      ECR_ROLE_TO_ASSUME:
        required: true

concurrency:
  group: preview-deploy-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ecr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v5
        with:
          java-version: '25'
          distribution: corretto

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
      - run: ./gradlew clean build

      - name: Login to ECR
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/ecr-auth@7c81d37978aef9418f7185d9ecf70e3cd1c63c02 # main
        id: auth
        with:
          ecr_region: ${{ vars.ECR_REGION }}
          ecr_role: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          role-session-name: preview

      - name: Build and push preview image
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/build-and-push@7c81d37978aef9418f7185d9ecf70e3cd1c63c02 # main
        with:
          dockerfile_path: ./Dockerfile
          image_registry: ${{ steps.auth.outputs.image_registry }}
          image_repo: ${{ vars.ECR_REPOSITORY }}
          image_tag: pr-${{ inputs.pr_number }}

  deploy-preview:
    needs: ecr
    uses: ./.github/workflows/_deploy-to-env.yml
    with:
      environment: dev
      preview_id: pr-${{ inputs.pr_number }}
      preview_schema_id: pr_${{ inputs.pr_number }}
    secrets: inherit
