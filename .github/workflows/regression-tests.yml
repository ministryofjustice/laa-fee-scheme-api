name: Regression tests

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to run regression tests against"
        required: true
        type: choice
        options:
          - preview
          - development
          - uat
          - staging
      preview_id:
        description: "Preview release id (required when target_environment=preview)"
        required: false
        type: string
  workflow_call:
    inputs:
      target_environment:
        description: "Environment to run regression tests against"
        required: true
        type: string
      preview_id:
        description: "Preview release id (required when target_environment=preview)"
        required: false
        type: string
    secrets:
      KUBE_CERT:
        required: true
      KUBE_CLUSTER:
        required: true
      KUBE_TOKEN:
        required: true
      KUBE_NAMESPACE:
        required: true
      FSP_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  environment-regression-tests:
    environment: ${{ (inputs.target_environment == 'development' || inputs.target_environment == 'preview') && 'dev' || inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.4

      - name: Authenticate to Kubernetes Cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@7c81d37978aef9418f7185d9ecf70e3cd1c63c02 # main
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Resolve target service
        id: target
        run: |
          if [[ "${{ inputs.target_environment }}" == "preview" ]]; then
            if [[ -z "${{ inputs.preview_id }}" ]]; then
              echo "preview_id is required when target_environment=preview" >&2
              exit 1
            fi
            SERVICE_NAME="laa-fee-scheme-api-${{ inputs.preview_id }}-service"
          else
            SERVICE_NAME="laa-fee-scheme-api-service"
          fi

          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Port forward app service
        uses: ./.github/actions/port-forward-service
        with:
          kube_namespace: ${{ secrets.KUBE_NAMESPACE }}
          service_name: ${{ steps.target.outputs.service_name }}
          local_port: "8085"
          remote_port: "8085"
          pid_env_var: PORT_FORWARD_APP_PID
          wait_label: fsp-api

      - name: Port forward actuator service
        uses: ./.github/actions/port-forward-service
        with:
          kube_namespace: ${{ secrets.KUBE_NAMESPACE }}
          service_name: ${{ steps.target.outputs.service_name }}
          local_port: "8185"
          remote_port: "8185"
          pid_env_var: PORT_FORWARD_ACTUATOR_PID
          wait_label: fsp-api-actuator

      - name: Create regression test environment file
        run: |
          cat > scheme-service/src/regressionTest/.env <<'EOF'
          FSP_API_BASE_URL=http://localhost:8085
          APP_HEALTHCHECK_URL=http://localhost:8185/actuator/health
          FSP_API_TOKEN=${{ secrets.FSP_API_TOKEN }}
          EOF

      - name: Run regression tests
        run: ./run-regression-tests.sh --environment

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: regression-reports-${{ inputs.target_environment }}-${{ github.run_id }}
          path: scheme-service/src/regressionTest/reports
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup port-forward
        if: always()
        run: |
          if [ -n "${PORT_FORWARD_APP_PID:-}" ]; then
            kill "$PORT_FORWARD_APP_PID" || true
          fi
          if [ -n "${PORT_FORWARD_ACTUATOR_PID:-}" ]; then
            kill "$PORT_FORWARD_ACTUATOR_PID" || true
          fi
