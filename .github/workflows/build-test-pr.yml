name: PR build and test
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Build and run tests
        uses: './.github/actions/build-and-test'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Run pitest (mutation testing)
        run: ./gradlew :scheme-service:pitest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload pitest HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pitest-report
          path: scheme-service/build/reports/pitest
          retention-days: 14

  snyk-vulnerability-scan:
    uses: ./.github/workflows/snyk-vulnerability-scans.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SLACK_PROD_WEBHOOK_URL: ${{ secrets.SLACK_PROD_WEBHOOK_URL }}

  zap-pr-scan:
    uses: ./.github/workflows/zap-security-scan.yml
    secrets:
      SLACK_PROD_WEBHOOK_URL: ${{ secrets.SLACK_PROD_WEBHOOK_URL }}

  sca-pr-scan:
    uses: ./.github/workflows/sca-analysis.yml
    secrets:
      SLACK_PROD_WEBHOOK_URL: ${{ secrets.SLACK_PROD_WEBHOOK_URL }}

  docker-regression-tests:
    needs: build-test
    uses: ./.github/workflows/pr-regression-tests.yml
    secrets: inherit

  check-for-preview-deploy:
    permissions:
      id-token: write
      contents: read
    if: contains(github.event.pull_request.labels.*.name, 'preview-deploy')
    needs: [ build-test, snyk-vulnerability-scan, zap-pr-scan, sca-pr-scan, docker-regression-tests ]
    uses: ./.github/workflows/deploy-preview.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets: inherit